<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>flipdiff report</title>
<style>/*__FLIPDIFF_CSS__*/</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span><h1>flipdiff</h1></div>
  <dl class="meta" id="meta"></dl>
  <div class="chips" id="chips" role="list" aria-label="Totals by status"></div>
</header>
<main>
  <div class="toolbar">
    <div class="seg" role="group" aria-label="Row filter">
      <button type="button" id="f-issues" aria-pressed="false">Failures only</button>
      <button type="button" id="f-all" aria-pressed="true">All</button>
    </div>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <div class="table-wrap">
    <table id="tbl">
      <thead><tr id="thead-row"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <p class="empty" id="empty" hidden>Nothing to show with this filter.</p>
  </div>
</main>
<noscript><p class="noscript">This report needs JavaScript to render its table. The raw data is in the JSON script tag of this page and in flipdiff-report.v1.json.</p></noscript>
<script type="application/json" id="flipdiff-data">__FLIPDIFF_DATA__</script>
<script>/*__FLIPDIFF_JS__*/</script>
</body>
</html>
