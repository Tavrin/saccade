<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>flipdiff run overview</title>
<style>/*__SERVE_CSS__*/</style>
<style>/*__RUNS_CSS__*/</style>
</head>
<body class="runs">
<header class="top">
  <div class="brand"><a class="back" id="back" href="/" hidden>&larr; Browse</a><span class="logo" aria-hidden="true"></span><h1>flipdiff</h1><span class="tag">runs</span></div>
  <span class="sub" id="reflabel"></span>
  <span class="grow"></span>
  <a class="btn primary" id="openall" href="#" hidden>Open all in viewer</a>
</header>
<main class="rpage" id="rpage">
  <p class="hint" id="loading" role="status">Loading the overview…</p>
  <div class="bar wide" id="progress" aria-hidden="true" hidden><i></i></div>
  <p class="hint err" id="rerror" role="alert" hidden></p>

  <section class="card" id="cfgcard" aria-label="Run-level configuration differences" hidden>
    <h2>Run configuration differences</h2>
    <div class="tablewrap"><table class="cfg" id="cfgtable"></table></div>
  </section>

  <section id="summaries" class="summaries" aria-label="Runs against the reference"></section>

  <section class="card" id="pairpanel" aria-label="Pair the images by hand" hidden></section>

  <section class="card" id="matrixcard" aria-label="Image matrix" hidden>
    <div class="cardhead">
      <h2>Matrix</h2>
      <span class="hint" id="mprog"></span>
      <span class="grow"></span>
      <label class="inl">Order
        <select id="msort"><option value="worst">Worst first</option><option value="name">Name</option></select>
      </label>
      <label class="inl"><input type="checkbox" id="mchanged"> Changed only</label>
    </div>
    <div class="matrixwrap"><table class="matrix" id="matrix"></table></div>
    <p class="hint" id="mnote"></p>
  </section>

  <section class="card" id="contactcard" aria-label="Contact sheet" hidden>
    <div class="cardhead">
      <h2>Contact sheet</h2>
      <label class="inl">Compare <b id="refname"></b> with
        <select id="csrun"></select>
      </label>
      <span class="grow"></span>
      <label class="inl swipelbl">Swipe all
        <input type="range" id="csslider" min="0" max="100" value="50" aria-label="Swipe position for every image">
        <output id="csval">50%</output>
      </label>
      <label class="inl"><input type="checkbox" id="cschanged"> Changed only</label>
    </div>
    <p class="hint">Left of the divider is the reference, right is the run. Use the left and right arrow keys (shift for bigger steps), or drag on any image.</p>
    <div class="sheet" id="sheet"></div>
  </section>
</main>
<div class="tip" id="tip" role="tooltip" hidden></div>
<script>window.FLIPDIFF_RUNS = __RUNS_PAGE__;</script>
<script>/*__RUNS_JS__*/</script>
</body>
</html>
