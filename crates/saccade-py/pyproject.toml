[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[project]
name = "saccade"
version = "0.2.0"
requires-python = ">=3.10"
description = "Local image and media analysis with explicit evidence provenance"
license = "MIT OR Apache-2.0"
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Rust"]

[tool.maturin]
# Keep extension linking out of ordinary Cargo builds and tests.
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "saccade._native"

[tool.pytest.ini_options]
markers = ["heavy: requires pinned models and ONNX Runtime"]
