[package]
name = "saccade"
description = "Visual-regression CLI for renderers and graphics code, built on NVIDIA FLIP"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"
exclude = ["report/**"]

[dependencies]
saccade-geo = { path = "../saccade-geo", version = "0.2.7", optional = true }
saccade-print = { path = "../saccade-print", version = "0.2.7", optional = true }
ureq = { version = "3", optional = true }
url = { version = "2.5", optional = true }
roxmltree = { version = "0.20", optional = true }
saccade-core = { workspace = true, default-features = false }
image.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_ignored = "=0.1.14"
sha2 = "0.10"
libc = "0.2"
colorvideovdp = { version = "0.1.1", default-features = false, features = ["parallel"], optional = true }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
globset = "0.4"
fs2 = "0.4.3"

# wave10: embedded-schema producer validation (MIT).
jsonschema = { version = "0.30", default-features = false }

[features]
geo = ["dep:saccade-geo"]
# O12/O17: deterministic text pixel evidence, no added dependencies.
text-quality = ["saccade-core/text-quality"]
print = ["dep:saccade-print"]
ocr-provider = ["assist", "saccade-core/ocr-provider"]
media-http = ["saccade-core/media-http"]
products = ["dep:ureq", "dep:url", "dep:roxmltree", "compression", "image/webp"]
imgtune-avif = ["products", "image/avif", "image/avif-native"]
documents = ["saccade-core/documents"]
credentials = ["saccade-core/credentials"]
# Dynamic CPU ONNX embeddings, no default dependency change
embeddings = ["saccade-core/embeddings"]
default = ["compression", "parallel", "graphics", "ai", "workbench", "mcp", "evaluation"]
semantic-regions = ["saccade-core/semantic-regions"]
compression = ["saccade-core/compression"]
parallel = ["saccade-core/parallel"]
dense-motion = ["saccade-core/dense-motion"]
geometry = ["saccade-core/geometry"]
graphics = ["saccade-core/graphics", "dep:colorvideovdp"]
ai = ["saccade-core/ai"]
workbench = ["saccade-core/workbench"]
mcp = []
evaluation = ["ai", "saccade-core/evaluation"]
prechecks = ["saccade-core/prechecks"]
schema = ["saccade-core/schema"]
# Optional external pinned Tesseract execution; no bundled runtime/models.
ocr = ["saccade-core/ocr"]

assist = ["ai", "saccade-core/assist"]

# wave7
local-models = ["saccade-core/local-models"]
local-vlm = ["saccade-core/local-vlm"]
vision-providers = ["saccade-core/vision-providers"]

[dev-dependencies]
tempfile = "3"
# Validates real command output against the shipped schemas (MIT).

[lints]
workspace = true

[[test]]
name = "precheck_contract"
required-features = ["prechecks", "mcp"]

[[test]]
name = "judge_contract"
required-features = ["evaluation", "workbench", "mcp", "graphics"]

[[test]]
name = "review_contract"
required-features = ["evaluation", "mcp"]

[[test]]
name = "s6_contract"
required-features = ["graphics", "workbench", "mcp"]

[[test]]
name = "perf_evidence"
required-features = ["graphics", "workbench", "mcp"]

[[test]]
name = "perf_comparability"
required-features = ["graphics"]

[[test]]
name = "runs_cli"
required-features = ["mcp"]

[[test]]
name = "v1_contract"
required-features = ["graphics", "mcp"]

[[test]]
name = "agent_contract"
required-features = ["mcp"]

[[test]]
name = "agent_native"
required-features = ["mcp"]

[[test]]
name = "f1_contract"
required-features = ["ai", "mcp"]

[[test]]
name = "assist_contract"
required-features = ["assist", "mcp"]

[[test]]
name = "quality_reference"
required-features = ["compression"]

[[test]]
name = "wave10_field"
required-features = ["graphics"]

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }
