[package]
name = "saccade"
description = "Visual-regression CLI for renderers and graphics code, built on NVIDIA FLIP"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"
exclude = ["report/**"]

[dependencies]
saccade-core = { workspace = true, default-features = false }
image.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_ignored = "=0.1.14"
sha2 = "0.10"
libc = "0.2"
colorvideovdp = { version = "0.1.1", default-features = false, features = ["parallel"], optional = true }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
globset = "0.4"
fs2 = "0.4.3"

[features]
default = ["compression", "parallel", "graphics", "ai", "workbench", "mcp", "evaluation"]
semantic-regions = ["saccade-core/semantic-regions"]
compression = ["saccade-core/compression"]
parallel = ["saccade-core/parallel"]
dense-motion = ["saccade-core/dense-motion"]
geometry = ["saccade-core/geometry"]
graphics = ["saccade-core/graphics", "dep:colorvideovdp"]
ai = ["saccade-core/ai"]
workbench = ["saccade-core/workbench"]
mcp = []
evaluation = ["ai", "saccade-core/evaluation"]
prechecks = ["saccade-core/prechecks"]
schema = ["saccade-core/schema"]
# Optional external pinned Tesseract execution; no bundled runtime/models.
ocr = []

[dev-dependencies]
tempfile = "3"
# Validates real command output against the shipped schemas (MIT).
jsonschema = { version = "0.30", default-features = false }

[lints]
workspace = true

[[test]]
name = "precheck_contract"
required-features = ["prechecks", "mcp"]

[[test]]
name = "judge_contract"
required-features = ["evaluation", "workbench", "mcp", "graphics"]

[[test]]
name = "review_contract"
required-features = ["evaluation", "mcp"]

[[test]]
name = "s6_contract"
required-features = ["graphics", "workbench", "mcp"]

[[test]]
name = "perf_evidence"
required-features = ["graphics", "workbench", "mcp"]

[[test]]
name = "perf_comparability"
required-features = ["graphics"]

[[test]]
name = "runs_cli"
required-features = ["mcp"]

[[test]]
name = "v1_contract"
required-features = ["graphics", "mcp"]

[[test]]
name = "agent_contract"
required-features = ["mcp"]

[[test]]
name = "agent_native"
required-features = ["mcp"]

[[test]]
name = "f1_contract"
required-features = ["ai", "mcp"]
