[package]
name = "saccade-a11y"
description = "Offline automatic image accessibility pre-checks for Saccade"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["accessibility", "wcag", "contrast", "color-blindness"]
categories.workspace = true
include = ["src/**", "tests/**", "examples/**", "Cargo.toml", "README.md", "LICENSE-*"]

[dependencies]
saccade-core = { workspace = true, features = ["prechecks", "text-quality"] }
image.workspace = true
serde.workspace = true
serde_json.workspace = true
toml = "0.8"
globset = "0.4"

[features]
default = []
ai = ["saccade-core/ai"]
ocr = ["saccade-core/ocr"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
