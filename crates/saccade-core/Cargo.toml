[package]
name = "saccade-core"
description = "NVIDIA FLIP image comparison and the report model behind the saccade CLI"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
image.workspace = true
exr = "1"
flip-rs = { workspace = true, default-features = false }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
globset = "0.4"
walkdir = "2"
dunce = "1"
toml = "0.8"
rayon = "1"
rustfft = "6"
# Published 0.5.1: BSD-2-Clause, MSRV 1.65; newer repository HEAD differs.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "load-dynamic"], optional = true }
ssimulacra2 = { version = "=0.5.1", default-features = false, optional = true }
# Published 0.9.3: BSD-3-Clause, MSRV 1.89; official reference-qualified.
butteraugli = { version = "=0.9.3", default-features = false, optional = true }
# Pure Rust ICC transforms; BSD-3-Clause OR Apache-2.0, Rust 1.85.
moxcms = { version = "=0.7.11", default-features = false }
sha2 = "0.10"
tiny_http = { version = "0.12", optional = true }
# Blocking HTTP client for the judge-mode providers (MIT OR Apache-2.0); no async runtime.
ureq = { version = "3", optional = true }
fs2 = { version = "0.4.3", optional = true }
httpdate = { version = "1", optional = true }
tempfile = "3"
schemars = { version = "1", optional = true }

parry3d-f64 = { version = "=0.21.1", optional = true }
tobj = { version = "=4.0.3", default-features = false, features = ["use_f64"], optional = true }
gltf = { version = "=1.4.1", default-features = false, features = ["utils", "names"], optional = true }
base64 = { version = "0.22", optional = true }

# Opt-in permissive document, credential and Rust OCR adapters
url = {version="2.5",optional=true}
roxmltree = "=0.21.1"
resvg = { version = "=0.48.1", default-features = false, features = ["text", "raster-images"], optional = true }
hayro = { version = "=0.3.0", default-features = false, optional = true }
c2pa = { version = "=0.90.22", default-features = false, features = ["rust_native_crypto"], optional = true }
imageproc = { version = "=0.25.0", default-features = false, optional = true }
serde_yaml = { version = "=0.9.34", optional = true }
# wave7b: pinned BERT/CLIP tokenizers, no network/pretrained loader feature.
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"], optional = true }

# wave7c: bounded release archive provisioning, optional CPU runtime only.
flate2 = { version = "=1.1.10", optional = true }
tar = { version = "=0.4.46", default-features = false, optional = true }

[features]
# O12/O17: deterministic text pixel evidence, no added dependencies.
text-quality = []
ocr-provider = ["assist", "dep:base64"]
documents = ["dep:resvg", "dep:hayro", "dep:flate2"]
credentials = ["dep:c2pa"]
ocr = ["local-models", "dep:imageproc", "dep:serde_yaml"]
# Dynamic CPU ONNX embeddings, no default dependency change
embeddings = ["semantic-regions", "dep:base64", "dep:tokenizers"]
default = ["parallel"]
# Parallel FLIP filtering; disable for the sequential FLIP backend on wasm.
parallel = ["flip-rs/parallel"]
# Graphics computations; their report types remain available in every build.
graphics = []
# Bounded CPU dense inverse search, no native runtime or model dependencies.
dense-motion = []
# Compression scoring is independent of graphics and provider adapters.
compression = ["dep:ssimulacra2", "dep:butteraugli"]
# Optional dynamically loaded ONNX runtime, explicit cache downloads only.
semantic-regions = ["dep:ort", "dep:ureq", "dep:fs2"]
# Deterministic f64 triangle-surface measurement and mesh loaders.
geometry = ["dep:parry3d-f64", "dep:tobj", "dep:gltf", "dep:base64"]
# Provider adapters and review orchestration.
ai = ["dep:ureq", "dep:fs2", "dep:httpdate"]
# Local HTTP workbench, independent of AI.
workbench = ["dep:tiny_http", "dep:base64"]
# wave8
media-http = ["dep:ureq"]
# Replay, calibration and provider conformance.
evaluation = ["ai"]
# Experimental safety/accessibility checks.
prechecks = []
# Derives `schemars::JsonSchema` on the report, decisions and explain types.
schema = ["dep:schemars"]

assist = ["ai", "serde_json/raw_value"]
# wave7
local-models = ["dep:ort", "dep:ureq", "dep:fs2", "dep:tokenizers", "dep:flate2", "dep:tar"]
local-vlm = ["dep:ureq", "dep:base64"]
vision-providers = ["dep:base64", "dep:url"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true

[[example]]
name = "build_review_labels"
required-features = ["evaluation"]

[[example]]
name = "pilot_offline"
required-features = ["evaluation", "graphics"]

[[example]]
name = "corpus_batch"
required-features = ["evaluation"]

[[test]]
name = "perf"
required-features = ["graphics"]

[[test]]
name = "v1_sequences_rank"
required-features = ["graphics"]

[[test]]
name = "v1_buffers"
required-features = ["graphics"]

[[test]]
name = "prechecks"
required-features = ["prechecks"]

[[test]]
name = "schemas"
required-features = ["schema"]

[[example]]
name = "assist_qualify"
required-features = ["assist"]

[[example]]
name = "r2_credentials"
required-features = ["credentials"]

# wave8: bounded URL input and local API remain optional.

# wave8: safe OpenOptions flags reject special-file reads without blocking on Unix.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[example]]
name = "ocr_accents"
required-features = ["ocr"]

[[example]]
name = "assist_openrouter_smoke"
required-features = ["assist"]
