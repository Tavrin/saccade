[[judge]]
provider = "human"
role = "a rendering expert"
rubric = "Judge against the stated intent. Use unsure if the crops do not settle it."
weight = 2.0
questions = ["accept", "triage", "cause", "ask_human", "mask_suggest", "preference"]
