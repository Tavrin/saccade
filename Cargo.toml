[workspace]
resolver = "3"
members = ["crates/saccade-core", "crates/saccade", "crates/saccade-py", "crates/saccade-print", "crates/saccade-geo"]
default-members = ["crates/saccade-core", "crates/saccade"]

[workspace.package]
version = "0.2.10"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tavrin/saccade"
keywords = ["visual-regression", "flip", "rendering", "image-diff", "ci"]
categories = ["graphics", "development-tools::testing", "command-line-utilities"]

[workspace.dependencies]
saccade-core = { path = "crates/saccade-core", version = "0.2.10", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "exr", "hdr"] }
flip-rs = { version = "0.1.2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Keep contributor/CI executables within the bounded replay-pack inventory.
[profile.dev]
debug = 0

# Optional adapters add enough symbol-table bytes to exceed the replay file cap.
[profile.dev.package.saccade]
strip = "symbols"
