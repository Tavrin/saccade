[workspace]
resolver = "3"
members = ["crates/flipdiff-core", "crates/flipdiff"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OWNER/flipdiff"
keywords = ["visual-regression", "flip", "rendering", "image-diff", "ci"]
categories = ["graphics", "development-tools::testing", "command-line-utilities"]

[workspace.dependencies]
flipdiff-core = { path = "crates/flipdiff-core", version = "0.1.0" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
nv-flip = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
