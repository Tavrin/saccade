name: saccade
description: Perceptual (NVIDIA FLIP) visual-regression check for renderer output. Compares baseline and capture images, uploads an HTML report, writes a job summary and keeps one pull-request comment up to date.
author: saccade contributors
branding:
  icon: image
  color: purple

inputs:
  baseline-dir:
    description: Directory of committed baseline images, searched recursively. Images are paired with the captures by relative path.
    required: true
  capture-dir:
    description: Directory of freshly captured images, searched recursively.
    required: true
  threshold:
    description: Default pass threshold, a FLIP value from 0 (identical) to 1. Empty uses saccade.toml, then 0.01.
    required: false
    default: ''
  metric:
    description: Statistic of the FLIP error map that is compared with the threshold, one of mean, p95 or max. Empty uses saccade.toml, then mean.
    required: false
    default: ''
  config:
    description: Path to a saccade.toml (thresholds, overrides, regions, masks, HDR settings). Empty uses ./saccade.toml if it exists.
    required: false
    default: ''
  report-dir:
    description: Directory the report is written to, relative to the workspace. An absolute path works for the comparison and the summary, but the report is then not uploaded as an artifact.
    required: false
    default: saccade-report
  artifact-name:
    description: Name of the uploaded report artifact. Matrix jobs must each use a distinct name, because upload-artifact v4 rejects duplicates.
    required: false
    default: saccade-report
  comment-key:
    description: Key that makes the sticky pull-request comment unique, for matrix jobs (the marker becomes "saccade-summary:<key>"). ASCII letters, digits, ".", "_" and "-", at most 64 characters. Empty uses the single shared comment.
    required: false
    default: ''
  fail-on-new:
    description: Treat captures without a baseline as a regression. Set to 'true' to enable.
    required: false
    default: 'false'
  comment:
    description: Create or update one pull-request comment with the summary (pull_request events only; needs pull-requests write permission, and is skipped with a warning when the token is read-only, for example on fork PRs). Set to 'false' to disable.
    required: false
    default: 'true'
  update-baselines:
    description: Open a baseline-update PR on workflow_dispatch only. Requires contents write and pull-requests write; never runs on fork PRs.
    required: false
    default: 'false'
  update-branch-prefix:
    description: Prefix for the new baseline-update branch, suffixed with the run ID.
    required: false
    default: saccade/update-baselines
  update-prune-missing:
    description: With update-baselines, also delete missing baselines through approve --prune-missing. Explicit opt-in.
    required: false
    default: 'false'
  github-token:
    description: Token used to post the comment and to download the prebuilt release binary.
    required: false
    default: ${{ github.token }}
  version:
    description: Git ref (tag, branch or commit) of the saccade repository to install. Uses a release binary for that ref if one exists, otherwise a build from source with cargo. Empty uses the ref this action was invoked with.
    required: false
    default: ''

outputs:
  exit-code:
    description: Exit code of saccade compare, which is also the job's result (0 no regression, 1 regression, 2 usage, config or IO error).
    value: ${{ steps.compare.outputs.exit-code }}
  failed:
    description: Number of images over their threshold.
    value: ${{ steps.compare.outputs.failed }}
  new:
    description: Number of captures without a baseline.
    value: ${{ steps.compare.outputs.new }}
  report-dir:
    description: Directory the report was written to (the report-dir input).
    value: ${{ inputs.report-dir }}

runs:
  using: composite
  steps:
    - name: Install saccade
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        ref="${INPUT_VERSION:-$ACTION_REF}"
        repo="${ACTION_REPO:-}"
        bin_dir="$RUNNER_TEMP/saccade-bin"
        mkdir -p "$bin_dir"

        case "$RUNNER_OS-$RUNNER_ARCH" in
          Linux-X64)    target=x86_64-unknown-linux-gnu;  ext=tar.gz ;;
          Linux-ARM64)  target=aarch64-unknown-linux-gnu; ext=tar.gz ;;
          macOS-ARM64)  target=aarch64-apple-darwin;      ext=tar.gz ;;
          Windows-X64)  target=x86_64-pc-windows-msvc;    ext=zip ;;
          *)            target=''; ext='' ;;
        esac

        installed=false
        if [ -n "$target" ] && [ -n "$ref" ] && [ -n "$repo" ]; then
          asset="saccade-$target.$ext"
          dl="$RUNNER_TEMP/saccade-dl"
          rm -rf "$dl"; mkdir -p "$dl"
          sha256_of() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            else
              shasum -a 256 "$1" | cut -d' ' -f1
            fi
          }
          if gh release download "$ref" --repo "$repo" --pattern "$asset" --pattern "$asset.sha256" --dir "$dl" 2>/dev/null; then
            want=''
            if [ -f "$dl/$asset.sha256" ]; then
              want="$(head -n 1 "$dl/$asset.sha256" | cut -d' ' -f1 | tr 'A-F' 'a-f')"
            fi
            got="$(sha256_of "$dl/$asset" || true)"
            if [ -n "$want" ] && [ "$want" = "$got" ]; then
              if [ "$ext" = zip ]; then
                unzip -q -o "$dl/$asset" -d "$bin_dir"
              else
                tar -xzf "$dl/$asset" -C "$bin_dir"
              fi
              if "$bin_dir/saccade" --version >/dev/null 2>&1; then
                installed=true
                echo "Installed prebuilt saccade from release $ref ($target), checksum verified"
              else
                echo "::warning::The prebuilt saccade does not run; building from source."
                rm -rf "$bin_dir"; mkdir -p "$bin_dir"
              fi
            else
              echo "::warning::Checksum of $asset is missing or does not match; building from source."
            fi
          fi
        fi

        if [ "$installed" != true ]; then
          echo "No prebuilt binary for ref '${ref:-<none>}' on $RUNNER_OS-$RUNNER_ARCH; building from source with cargo."
          if ! command -v cargo >/dev/null 2>&1; then
            echo "::error::cargo is not available on this runner. Install Rust (for example with dtolnay/rust-toolchain) before this action."
            exit 2
          fi
          root="$RUNNER_TEMP/saccade-root"
          if [ -n "$ref" ] && [ -n "$repo" ]; then
            cargo install --git "https://github.com/$repo" --rev "$ref" saccade --locked --root "$root"
          elif [ -n "$repo" ]; then
            cargo install --git "https://github.com/$repo" saccade --locked --root "$root"
          else
            cargo install --path "$ACTION_PATH/crates/saccade" --locked --root "$root"
          fi
          cp "$root"/bin/saccade* "$bin_dir"/
        fi
        echo "$bin_dir" >> "$GITHUB_PATH"

    - name: Compare images
      id: compare
      shell: bash
      env:
        BASELINE_DIR: ${{ inputs.baseline-dir }}
        CAPTURE_DIR: ${{ inputs.capture-dir }}
        REPORT_DIR: ${{ inputs.report-dir }}
        THRESHOLD: ${{ inputs.threshold }}
        METRIC: ${{ inputs.metric }}
        CONFIG: ${{ inputs.config }}
        FAIL_ON_NEW: ${{ inputs.fail-on-new }}
      run: |
        set -uo pipefail
        args=(compare "$BASELINE_DIR" "$CAPTURE_DIR" --out "$REPORT_DIR")
        [ -n "$THRESHOLD" ] && args+=(--threshold "$THRESHOLD")
        [ -n "$METRIC" ] && args+=(--metric "$METRIC")
        [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
        [ "$FAIL_ON_NEW" = true ] && args+=(--fail-on-new)

        set +e
        saccade "${args[@]}"
        code=$?
        set -e

        failed=0
        new=0
        report="$REPORT_DIR/saccade-report.v1.json"
        if [ -f "$report" ] && command -v jq >/dev/null 2>&1; then
          failed=$(jq -r '.totals.fail' "$report")
          new=$(jq -r '.totals.new' "$report")
        fi
        {
          echo "exit-code=$code"
          echo "failed=$failed"
          echo "new=$new"
        } >> "$GITHUB_OUTPUT"

    - name: Upload report
      id: upload
      if: ${{ always() && hashFiles(format('{0}/saccade-report.v1.json', inputs.report-dir)) != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.report-dir }}
        if-no-files-found: warn

    - name: Write job summary
      id: summary
      if: ${{ always() }}
      shell: bash
      env:
        REPORT_DIR: ${{ inputs.report-dir }}
        COMMENT_KEY: ${{ inputs.comment-key }}
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -uo pipefail
        report="$REPORT_DIR/saccade-report.v1.json"
        if [ ! -f "$report" ]; then
          echo "No report at $report; skipping summary."
          exit 0
        fi
        url="${ARTIFACT_URL:-$RUN_URL}"
        out="$RUNNER_TEMP/saccade-summary.md"
        sargs=(summary "$report" --format markdown --artifact-url "$url")
        marker='<!-- saccade-summary -->'
        if [ -n "$COMMENT_KEY" ]; then
          sargs+=(--comment-key "$COMMENT_KEY")
          marker="<!-- saccade-summary:$COMMENT_KEY -->"
        fi
        if ! saccade "${sargs[@]}" > "$out"; then
          echo "::error::saccade summary failed (is comment-key valid?)."
          exit 1
        fi
        cat "$out" >> "$GITHUB_STEP_SUMMARY"
        {
          echo "path=$out"
          echo "marker=$marker"
        } >> "$GITHUB_OUTPUT"

    - name: Pull request comment
      if: ${{ always() && github.event_name == 'pull_request' && inputs.comment == 'true' && steps.summary.outputs.path != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SUMMARY_PATH: ${{ steps.summary.outputs.path }}
        MARKER: ${{ steps.summary.outputs.marker }}
      run: |
        set -uo pipefail
        marker="$MARKER"
        id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
          --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1) || id=''
        if [ -n "$id" ]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@"$SUMMARY_PATH" >/dev/null \
            || echo "::warning::Could not update the saccade comment (read-only token on a fork PR?)."
        else
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$SUMMARY_PATH" >/dev/null \
            || echo "::warning::Could not create the saccade comment (read-only token on a fork PR?)."
        fi

    - name: Open baseline-update pull request
      id: update
      if: ${{ inputs.update-baselines == 'true' && github.event_name == 'workflow_dispatch' && !github.event.pull_request.head.repo.fork && (steps.compare.outputs.exit-code == '0' || steps.compare.outputs.exit-code == '1') && steps.summary.outputs.path != '' && steps.upload.outputs.artifact-url != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        BASE_BRANCH: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
        EVENT_NAME: ${{ github.event_name }}
        FORK: ${{ github.event.pull_request.head.repo.fork }}
        RUN_ID: ${{ github.run_id }}
        BRANCH_PREFIX: ${{ inputs.update-branch-prefix }}
        BASELINE_DIR: ${{ inputs.baseline-dir }}
        CAPTURE_DIR: ${{ inputs.capture-dir }}
        REPORT_DIR: ${{ inputs.report-dir }}
        PRUNE_MISSING: ${{ inputs.update-prune-missing }}
        SUMMARY_PATH: ${{ steps.summary.outputs.path }}
      run: |
        set -euo pipefail
        # Keep the event/fork checks at the write boundary as well as in `if`.
        if [ "$EVENT_NAME" != workflow_dispatch ] || [ "$FORK" = true ] || [ "$REF_TYPE" != branch ]; then
          echo "::error::Baseline updates require a trusted workflow_dispatch on a branch."
          exit 2
        fi
        cd -P "$GITHUB_WORKSPACE"
        workspace="$(pwd -P)"
        baseline_abs="$(cd -P "$BASELINE_DIR" && pwd -P)"
        case "$baseline_abs" in
          "$workspace"/*) ;;
          *) echo "::error::The baseline directory must be inside the checked-out repository."; exit 2 ;;
        esac
        branch="$BRANCH_PREFIX-$RUN_ID"
        git check-ref-format --branch "$branch" >/dev/null
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "::error::Baseline updates require a clean tracked checkout and no staged changes."
          exit 2
        fi
        # The checkout's credentials must allow contents: write; gh uses GH_TOKEN
        # for pull-requests: write. Fail rather than swallowing permission errors.
        args=(approve "$CAPTURE_DIR" "$baseline_abs" --all-failing "$REPORT_DIR/saccade-report.v1.json" --json)
        [ "$PRUNE_MISSING" = true ] && args+=(--prune-missing)
        approval="$RUNNER_TEMP/saccade-approved-$RUN_ID.json"
        saccade "${args[@]}" > "$approval"
        changed_paths="$RUNNER_TEMP/saccade-approved-$RUN_ID.paths"
        jq -j '.copied[].to, .pruned[] | . + "\u0000"' "$approval" > "$changed_paths"
        while IFS= read -r -d '' changed; do
          # Resolve directory aliases (including macOS /var and Git Bash drive
          # spellings). Pruned files no longer exist, but their parents do.
          changed_dir="$(cd -P "$(dirname -- "$changed")" && pwd -P)" || {
            echo "::error::Could not resolve the parent of an approved path."
            exit 2
          }
          changed_name="$(basename -- "$changed")"
          case "$changed_name" in
            .|..) echo "::error::approve returned a directory instead of a file."; exit 2 ;;
          esac
          changed_abs="$changed_dir/$changed_name"
          case "$changed_abs" in
            "$baseline_abs"/*) git --literal-pathspecs add -- "$changed_abs" ;;
            *) echo "::error::approve returned a path outside the baseline directory."; exit 2 ;;
          esac
        done < "$changed_paths"
        if git diff --cached --quiet; then
          echo "No baselines changed; no pull request needed."
          exit 0
        fi
        git switch -c "$branch"
        git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
          commit -m "Update saccade baselines (run $RUN_ID)"
        git push "$SERVER_URL/$REPO.git" "HEAD:refs/heads/$branch"
        gh pr create --repo "$REPO" --base "$BASE_BRANCH" --head "$branch" \
          --title "Update saccade baselines (run $RUN_ID)" --body-file "$SUMMARY_PATH"

    - name: Fail on regression
      if: ${{ always() }}
      shell: bash
      env:
        EXIT_CODE: ${{ steps.compare.outputs.exit-code }}
      run: |
        code="${EXIT_CODE:-2}"
        if [ "$code" != 0 ]; then
          echo "::error::saccade exited with code $code (1 = regression, 2 = usage or IO error)."
        fi
        exit "$code"
