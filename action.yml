name: saccade
description: Compare captured images against baselines with saccade and upload the report and JUnit results. Reviewed baseline updates open a pull request.
author: saccade contributors
branding:
  icon: image
  color: purple

inputs:
  baseline-dir:
    description: Directory of committed baseline images, searched recursively. Images are paired with the captures by relative path.
    required: true
  capture-dir:
    description: Directory of freshly captured images, searched recursively.
    required: true
  threshold:
    description: Default pass threshold, a FLIP value from 0 (identical) to 1. Empty uses saccade.toml, then 0.01.
    required: false
    default: ''
  metric:
    description: Statistic of the FLIP error map that is compared with the threshold, one of mean, p95 or max. Empty uses saccade.toml, then mean.
    required: false
    default: ''
  config:
    description: Path to a saccade.toml (thresholds, overrides, regions, masks, HDR settings). Empty uses ./saccade.toml if it exists.
    required: false
    default: ''
  report-dir:
    description: Report bundle directory. For updates, the restored immutable reviewed report directory; it is never regenerated.
    required: false
    default: saccade-report
  artifact-name:
    description: Name of the uploaded report artifact. Matrix jobs must each use a distinct name, because upload-artifact v4 rejects duplicates.
    required: false
    default: saccade-report
  comment-key:
    description: Key that makes the sticky pull-request comment unique, for matrix jobs (the marker becomes "saccade-summary:<key>"). ASCII letters, digits, ".", "_" and "-", at most 64 characters. Empty uses the single shared comment.
    required: false
    default: ''
  fail-on-new:
    description: Require new captures to fail, overriding onboarding configuration. Empty preserves configuration (new captures fail by default).
    required: false
    default: ''
  comment:
    description: Opt in to a sticky comment on same-repository pull requests; requires pull-requests write. Fork comments are skipped.
    required: false
    default: 'false'
  inline-images:
    description: Opt in to uploading at most three thumbnails and heatmap views to an orphan branch for the sticky PR comment. Requires comment true and contents write; fork PRs use the artifact link only.
    required: false
    default: 'false'
  asset-branch:
    description: Dedicated orphan branch for inline PR images (simple letters, digits, dot, underscore or hyphen only).
    required: false
    default: saccade-assets
  update-baselines:
    description: Apply a selected reviewed manifest on trusted default-branch workflow_dispatch only, then open a review PR. Requires contents write and pull-requests write.
    required: false
    default: 'false'
  update-branch-prefix:
    description: Prefix for the new baseline-update branch, suffixed with the run ID.
    required: false
    default: saccade/update-baselines
  update-manifest:
    description: Path to the reviewed approve --dry-run manifest.json. Its adjacent decision.json and the original report/captures must be restored from the same immutable evidence artifact.
    required: false
    default: ''
  update-manifest-sha256:
    description: SHA-256 of the exact reviewed manifest bytes, supplied by the trusted dispatcher. Required for updates.
    required: false
    default: ''
  update-prune-missing:
    description: Permit only the deletions selected by the reviewed decision and manifest. Explicit opt-in.
    required: false
    default: 'false'
  github-token:
    description: Token for release downloads, optional same-repository comments and explicitly dispatched update PRs. Inline images additionally need contents write. Ordinary comparisons need read permission only.
    required: false
    default: ${{ github.token }}
  version:
    description: Release tag for binary installation, or exact git revision for explicit source installation. Empty uses the action ref in binary mode and the downloaded action checkout in source mode.
    required: false
    default: ''
  install-mode:
    description: 'binary verifies a release checksum and never falls back; source explicitly builds with Cargo.'
    required: false
    default: binary

outputs:
  verdict:
    description: pass, fail (completed comparison gate), or command-error (installation/configuration/execution failure).
    value: ${{ steps.result.outputs.verdict || 'command-error' }}
  exit-code:
    description: Action result (0 comparison gate passes, 1 comparison gate fails, 2 installation, configuration or workflow error).
    value: ${{ steps.result.outputs.exit-code || '2' }}
  report-url:
    description: Download URL for the uploaded report artifact, including JUnit.
    value: ${{ steps.upload.outputs.artifact-url }}
  artifact-id:
    description: Immutable ID of the uploaded report artifact.
    value: ${{ steps.upload.outputs.artifact-id }}
  failed:
    description: Number of images over their threshold.
    value: ${{ steps.compare.outputs.failed }}
  new:
    description: Number of captures without a baseline.
    value: ${{ steps.compare.outputs.new }}
  report-dir:
    description: Directory the report was written to (the report-dir input).
    value: ${{ inputs.report-dir }}

runs:
  using: composite
  steps:
    - name: Install saccade
      id: install
      shell: bash
      env:
        INSTALL_MODE: ${{ inputs.install-mode }}
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPO: ${{ github.action_repository }}
        ACTION_PATH: ${{ github.action_path }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        ref="${INPUT_VERSION:-$ACTION_REF}"
        repo="${ACTION_REPO:-}"
        fail() { echo "::error::Installation error: $*"; exit 2; }
        bin_dir="$(mktemp -d "$RUNNER_TEMP/saccade-bin.XXXXXX")"
        mkdir -p "$bin_dir"
        exe=saccade
        [ "$RUNNER_OS" != Windows ] || exe=saccade.exe

        case "$INSTALL_MODE" in
          source)
            command -v cargo >/dev/null 2>&1 || fail 'source mode requires Rust/Cargo on PATH'
            root="$(mktemp -d "$RUNNER_TEMP/saccade-root.XXXXXX")"
            if [ -n "$INPUT_VERSION" ]; then
              [ -n "$repo" ] || fail 'a source version requires the action repository'
              cargo install --git "https://github.com/$repo" --rev "$INPUT_VERSION" saccade --locked --root "$root" || fail 'source build failed'
            else
              cargo install --path "$ACTION_PATH/crates/saccade" --locked --root "$root" || fail 'source build failed'
            fi
            cp "$root/bin/$exe" "$bin_dir/$exe" || fail 'source build produced no executable'
            ;;
          binary)
            [[ -n "$ref" && -n "$repo" ]] || fail 'binary mode requires a release version and repository; local actions must select source explicitly'

            case "$RUNNER_OS-$RUNNER_ARCH" in
              Linux-X64)    target=x86_64-unknown-linux-gnu;  ext=tar.gz ;;
              Linux-ARM64)  target=aarch64-unknown-linux-gnu; ext=tar.gz ;;
              macOS-ARM64)  target=aarch64-apple-darwin;      ext=tar.gz ;;
              Windows-X64)  target=x86_64-pc-windows-msvc;    ext=zip ;;
              *)            fail "no release target for $RUNNER_OS-$RUNNER_ARCH; select source explicitly" ;;
            esac

            asset="saccade-$target.$ext"
            dl="$(mktemp -d "$RUNNER_TEMP/saccade-dl.XXXXXX")"
            sha256_of() {
              if command -v sha256sum >/dev/null 2>&1; then
                sha256sum "$1" | cut -d' ' -f1
              else
                shasum -a 256 "$1" | cut -d' ' -f1
              fi
            }
            gh release download "$ref" --repo "$repo" --pattern "$asset" --pattern "$asset.sha256" --dir "$dl" || fail "release asset unavailable for $ref ($target)"
            [[ -f "$dl/$asset" && -f "$dl/$asset.sha256" ]] || fail 'release archive or checksum is missing'
            want="$(awk 'NR == 1 {print tolower($1)}' "$dl/$asset.sha256")"
            got="$(sha256_of "$dl/$asset")" || fail 'could not hash release archive'
            [[ "$want" =~ ^[0-9a-f]{64}$ && "$want" = "$got" ]] || fail "checksum mismatch for $asset"
            if [ "$ext" = zip ]; then
              unzip -q -o "$dl/$asset" "$exe" -d "$bin_dir" || fail 'invalid release archive'
            else
              tar -xzf "$dl/$asset" -C "$bin_dir" "$exe" || fail 'invalid release archive'
            fi
            echo "Installed release $ref ($target), checksum verified"
            ;;
          *) fail 'install-mode must be binary or source' ;;
        esac
        "$bin_dir/$exe" --version >/dev/null 2>&1 || fail 'installed executable does not run'
        echo "$bin_dir" >> "$GITHUB_PATH"

    - name: Compare images
      id: compare
      shell: bash
      env:
        BASELINE_DIR: ${{ inputs.baseline-dir }}
        CAPTURE_DIR: ${{ inputs.capture-dir }}
        REPORT_DIR: ${{ inputs.report-dir }}
        THRESHOLD: ${{ inputs.threshold }}
        METRIC: ${{ inputs.metric }}
        CONFIG: ${{ inputs.config }}
        FAIL_ON_NEW: ${{ inputs.fail-on-new }}
        UPDATE_BASELINES: ${{ inputs.update-baselines }}
        EVENT_NAME: ${{ github.event_name }}
        FORK: ${{ github.event.pull_request.head.repo.fork }}
        REF_TYPE: ${{ github.ref_type }}
        BASE_BRANCH: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -uo pipefail
        report="$REPORT_DIR/saccade-report.v1.json"
        written=false
        code=2
        if [ "$UPDATE_BASELINES" = true ]; then
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$FORK" != true ] && [ "$REF_TYPE" = branch ] && [ "$BASE_BRANCH" = "$DEFAULT_BRANCH" ] && [ -f "$report" ]; then
            # Keep the original reviewed bytes; do not compare again.
            code=$(jq -r 'if (.totals.fail + .totals.error + .totals.missing + (if .config.fail_on_new then .totals.new else 0 end)) > 0 or .totals.total == 0 then 1 else 0 end' "$report") || code=2
            written=true
          else
            echo '::error::Updates require trusted default-branch dispatch and a restored reviewed report.'
          fi
        elif [ "$UPDATE_BASELINES" = false ] && [ ! -e "$report" ]; then
          args=(compare "$BASELINE_DIR" "$CAPTURE_DIR" --out "$REPORT_DIR")
          [ -n "$THRESHOLD" ] && args+=(--threshold "$THRESHOLD")
          [ -n "$METRIC" ] && args+=(--metric "$METRIC")
          [ -n "$CONFIG" ] && args+=(--config "$CONFIG")
          [ "$FAIL_ON_NEW" = true ] && args+=(--fail-on-new)

          set +e
          saccade "${args[@]}"
          code=$?
          [ ! -f "$report" ] || written=true
        else
          echo '::error::Invalid update-baselines setting or an existing report; use a fresh report directory.'
        fi
        case "$code" in 0|1|2) ;; *) code=2 ;; esac

        failed=0
        new=0
        if [ "$written" = true ]; then
          if jq -e '.schema == "saccade-report.v1" and ([.totals.pass, .totals.fail, .totals.error, .totals.missing, .totals.new, .totals.total] | all(type == "number" and . >= 0 and floor == .))' "$report" >/dev/null; then
            failed=$(jq -r '.totals.fail' "$report")
            new=$(jq -r '.totals.new' "$report")
          else
            code=2
          fi
        fi
        case "$code" in 0) verdict=pass ;; 1) verdict=fail ;; *) verdict=command-error ;; esac
        {
          echo "exit-code=$code"
          echo "verdict=$verdict"
          echo "report-written=$written"
          echo "failed=$failed"
          echo "new=$new"
        } >> "$GITHUB_OUTPUT"

    - name: Export JUnit
      id: junit
      if: ${{ always() && steps.compare.outputs.report-written == 'true' }}
      shell: bash
      env:
        REPORT_DIR: ${{ inputs.report-dir }}
      run: |
        saccade inspect export "$REPORT_DIR/saccade-report.v1.json" --format junit --out "$REPORT_DIR/junit.xml"

    - name: Upload report
      id: upload
      if: ${{ always() && steps.compare.outputs.report-written == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.report-dir }}
        if-no-files-found: error
        include-hidden-files: true

    - name: Write job summary
      id: summary
      if: ${{ always() && steps.compare.outputs.report-written == 'true' }}
      shell: bash
      env:
        REPORT_DIR: ${{ inputs.report-dir }}
        COMMENT_KEY: ${{ inputs.comment-key }}
        ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -uo pipefail
        report="$REPORT_DIR/saccade-report.v1.json"
        if [ ! -f "$report" ]; then
          echo "No report at $report; skipping summary."
          exit 0
        fi
        url="${ARTIFACT_URL:-$RUN_URL}"
        out="$RUNNER_TEMP/saccade-summary.md"
        sargs=(inspect export "$report" --format markdown --out "$out" --artifact-url "$url")
        marker='<!-- saccade-summary -->'
        if [ -n "$COMMENT_KEY" ]; then
          sargs+=(--comment-key "$COMMENT_KEY")
          marker="<!-- saccade-summary:$COMMENT_KEY -->"
        fi
        if ! saccade "${sargs[@]}"; then
          echo "::error::saccade inspect export failed (is comment-key valid?)."
          exit 1
        fi
        cat "$out" >> "$GITHUB_STEP_SUMMARY"
        {
          echo "path=$out"
          echo "marker=$marker"
        } >> "$GITHUB_OUTPUT"

    - name: Publish inline PR images
      if: ${{ always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && github.event.pull_request.head.repo.full_name == github.repository && inputs.comment == 'true' && inputs.inline-images == 'true' && steps.summary.outputs.path != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPORT_DIR: ${{ inputs.report-dir }}
        SUMMARY_PATH: ${{ steps.summary.outputs.path }}
        ASSET_BRANCH: ${{ inputs.asset-branch }}
        SERVER_URL: ${{ github.server_url }}
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        FORK: ${{ github.event.pull_request.head.repo.fork }}
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python3 "$ACTION_PATH/scripts/pr-inline-assets.py"

    - name: Pull request comment
      if: ${{ always() && github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork && github.event.pull_request.head.repo.full_name == github.repository && inputs.comment == 'true' && steps.summary.outputs.path != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        SUMMARY_PATH: ${{ steps.summary.outputs.path }}
        MARKER: ${{ steps.summary.outputs.marker }}
      run: |
        set -uo pipefail
        id=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
          --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n 1) || id=''
        if [ -n "$id" ]; then
          gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@"$SUMMARY_PATH" >/dev/null \
            || echo "::warning::Could not update the saccade comment (read-only token on a fork PR?)."
        else
          gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$SUMMARY_PATH" >/dev/null \
            || echo "::warning::Could not create the saccade comment (read-only token on a fork PR?)."
        fi

    - name: Open baseline-update pull request
      id: update
      if: ${{ inputs.update-baselines == 'true' && github.event_name == 'workflow_dispatch' && !github.event.pull_request.head.repo.fork && github.ref_type == 'branch' && github.ref_name == github.event.repository.default_branch && (steps.compare.outputs.exit-code == '0' || steps.compare.outputs.exit-code == '1') && steps.summary.outputs.path != '' && steps.upload.outputs.artifact-url != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        SERVER_URL: ${{ github.server_url }}
        BASE_BRANCH: ${{ github.ref_name }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        REF_TYPE: ${{ github.ref_type }}
        EVENT_NAME: ${{ github.event_name }}
        FORK: ${{ github.event.pull_request.head.repo.fork }}
        RUN_ID: ${{ github.run_id }}
        BRANCH_PREFIX: ${{ inputs.update-branch-prefix }}
        BASELINE_DIR: ${{ inputs.baseline-dir }}
        CAPTURE_DIR: ${{ inputs.capture-dir }}
        REPORT_DIR: ${{ inputs.report-dir }}
        PRUNE_MISSING: ${{ inputs.update-prune-missing }}
        UPDATE_MANIFEST: ${{ inputs.update-manifest }}
        MANIFEST_SHA256: ${{ inputs.update-manifest-sha256 }}
        SUMMARY_PATH: ${{ steps.summary.outputs.path }}
      run: |
        set -euo pipefail
        # Keep the event/fork checks at the write boundary as well as in `if`.
        if [ "$EVENT_NAME" != workflow_dispatch ] || [ "$FORK" = true ] || [ "$REF_TYPE" != branch ] || [ "$BASE_BRANCH" != "$DEFAULT_BRANCH" ]; then
          echo "::error::Baseline updates require a trusted default-branch workflow_dispatch."
          exit 2
        fi
        cd -P "$GITHUB_WORKSPACE"
        workspace="$(pwd -P)"
        baseline_abs="$(cd -P "$BASELINE_DIR" && pwd -P)"
        case "$baseline_abs" in
          "$workspace"/*) ;;
          *) echo "::error::The baseline directory must be inside the checked-out repository."; exit 2 ;;
        esac
        branch="$BRANCH_PREFIX-$RUN_ID"
        git check-ref-format --branch "$branch" >/dev/null
        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "::error::Baseline updates require a clean tracked checkout and no staged changes."
          exit 2
        fi
        fail() { echo "::error::Reviewed update error: $*"; exit 2; }
        [[ "$MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ && -f "$UPDATE_MANIFEST" ]] || fail 'a reviewed manifest and its SHA-256 are required'
        if command -v sha256sum >/dev/null 2>&1; then
          got="$(sha256sum "$UPDATE_MANIFEST" | cut -d' ' -f1)"
        else
          got="$(shasum -a 256 "$UPDATE_MANIFEST" | cut -d' ' -f1)"
        fi
        [ "$got" = "$MANIFEST_SHA256" ] || fail 'manifest checksum mismatch'
        decision="$(dirname -- "$UPDATE_MANIFEST")/decision.json"
        jq -e --slurpfile d "$decision" '
          .case_id == $d[0].binding.case_id and .decision_id == $d[0].decision_id and
          .channel == "cli" and .human_attestation == null and
          (.entries | type == "array" and length > 0) and
          ([.entries[].entry_id] | length == (unique | length))
        ' "$UPDATE_MANIFEST" >/dev/null || fail 'manifest is not the selected CLI decision plan'
        selected="$RUNNER_TEMP/saccade-selected-$RUN_ID.paths"
        jq -j '.entries[].entry_id + "\u0000"' "$UPDATE_MANIFEST" > "$selected"
        args=(approve "$CAPTURE_DIR" "$baseline_abs" --report "$REPORT_DIR/saccade-report.v1.json" --decisions "$decision" --json)
        while IFS= read -r -d '' entry; do args+=(--entry "$entry"); done < "$selected"
        [ "$PRUNE_MISSING" = true ] && args+=(--prune-missing)
        plan="$(mktemp -d "$RUNNER_TEMP/saccade-plan.XXXXXX")"
        saccade "${args[@]}" --dry-run --out "$plan"
        [ "$(jq -S -c . "$UPDATE_MANIFEST")" = "$(jq -S -c . "$plan/manifest.json")" ] || fail 'current dry-run differs from the reviewed manifest'
        receipt="$(mktemp -d "$RUNNER_TEMP/saccade-receipt.XXXXXX")"
        approval="$RUNNER_TEMP/saccade-approved-$RUN_ID.json"
        saccade "${args[@]}" --out "$receipt" > "$approval"
        # The result envelope is bounded. Stage every selected manifest entry,
        # rather than the first five copied/pruned paths in the CLI summary.
        changed_paths=()
        while IFS= read -r -d '' entry; do
          changed="$baseline_abs/$entry"
          # Resolve directory aliases (including macOS /var and Git Bash drive
          # spellings). Pruned files no longer exist, but their parents do.
          changed_dir="$(cd -P "$(dirname -- "$changed")" && pwd -P)" || {
            echo "::error::Could not resolve the parent of an approved path."
            exit 2
          }
          changed_name="$(basename -- "$changed")"
          case "$changed_name" in
            .|..) echo "::error::approve returned a directory instead of a file."; exit 2 ;;
          esac
          changed_abs="$changed_dir/$changed_name"
          case "$changed_abs" in
            "$baseline_abs"/*) changed_paths+=("$changed_abs") ;;
            *) echo "::error::approve returned a path outside the baseline directory."; exit 2 ;;
          esac
        done < "$selected"
        git --literal-pathspecs add -- "${changed_paths[@]}"
        if git diff --cached --quiet; then
          echo "No baselines changed; no pull request needed."
          exit 0
        fi
        git switch -c "$branch"
        git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
          commit -m "Update saccade baselines (run $RUN_ID)"
        # Supply credentials only for this push, without persisting checkout
        # credentials or printing the token in command arguments.
        auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\r\n')"
        GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$SERVER_URL/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
          git push "$SERVER_URL/$REPO.git" "HEAD:refs/heads/$branch"
        gh pr create --repo "$REPO" --base "$BASE_BRANCH" --head "$branch" \
          --title "Update saccade baselines (run $RUN_ID)" --body-file "$SUMMARY_PATH"

    - name: Fail on regression
      id: result
      if: ${{ always() }}
      shell: bash
      env:
        EXIT_CODE: ${{ steps.compare.outputs.exit-code }}
        INSTALL_OUTCOME: ${{ steps.install.outcome }}
        COMPARE_OUTCOME: ${{ steps.compare.outcome }}
        JUNIT_OUTCOME: ${{ steps.junit.outcome }}
        UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        UPDATE_OUTCOME: ${{ steps.update.outcome }}
      run: |
        code="${EXIT_CODE:-2}"
        for outcome in "$INSTALL_OUTCOME" "$COMPARE_OUTCOME" "$JUNIT_OUTCOME" "$UPLOAD_OUTCOME" "$SUMMARY_OUTCOME" "$UPDATE_OUTCOME"; do
          [ "$outcome" != failure ] || code=2
        done
        case "$code" in 0) verdict=pass ;; 1) verdict=fail ;; *) code=2; verdict=command-error ;; esac
        {
          echo "exit-code=$code"
          echo "verdict=$verdict"
        } >> "$GITHUB_OUTPUT"
        if [ "$code" != 0 ]; then
          echo "::error::saccade Action exit code $code (1 = comparison gate failure, 2 = installation, configuration or workflow error)."
        fi
        exit "$code"
