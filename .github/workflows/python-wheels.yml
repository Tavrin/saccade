name: Python wheels and PyPI
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: ['crates/saccade-py/**', 'crates/saccade-core/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/python-wheels.yml']
permissions:
  contents: read
jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64
            manylinux: '2_28'
          - runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: '2_28'
          - runner: macos-14
            target: aarch64
            manylinux: 'off'
          - runner: windows-2022
            target: x86_64
            manylinux: 'off'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked -j 4 --manifest-path crates/saccade-py/Cargo.toml --out dist
      - name: Install wheel and test dependencies
        shell: bash
        run: python -m pip install dist/*.whl pytest
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
      - name: Build companion CLI for batch package proof
        shell: bash
        run: |
          cargo build --locked -p saccade --no-default-features
          cli_suffix=''
          if [[ "${{ runner.os }}" == 'Windows' ]]; then cli_suffix='.exe'; fi
          echo "SACCADE_BIN=$GITHUB_WORKSPACE/target/debug/saccade$cli_suffix" >> "$GITHUB_ENV"
      - name: Installed-wheel smoke and generated fixture tests
        shell: bash
        run: |
          python crates/saccade-py/tests/smoke_wheel.py
          python -m pytest crates/saccade-py/tests/test_light.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-${{ matrix.runner }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release tag matches package version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          with open("crates/saccade-py/pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          assert os.environ["RELEASE_TAG"] == "v" + version
          PY
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --manifest-path crates/saccade-py/Cargo.toml --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.13.0
