name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/qualify.yml'
      - 'scripts/release-check.sh'
      - 'scripts/bundles.py'
      - 'scripts/bundles.json'
      - 'scripts/test-bundles.py'
      - 'docs/install-matrix.md'
      - 'crates/saccade/Cargo.toml'
      - 'crates/saccade-core/Cargo.toml'
      - 'scripts/generate-third-party-notices.py'
      - 'scripts/validate-showcase-schemas.py'
      - 'scripts/verify-sha256sums.py'
  workflow_dispatch:
    inputs:
      tag:
        description: Version label to validate (for example v0.2.4); dispatch never creates a release
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_RUSTC_WRAPPER: ''
  RUSTC_WRAPPER: ''

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: python3 scripts/test-bundles.py
      - name: Resolve the version label
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, tomllib
          if os.environ['EVENT'] == 'push':
              tag = os.environ['REF_NAME']
          elif os.environ['INPUT_TAG']:
              tag = os.environ['INPUT_TAG']
          else:
              # Pull-request and manual dry runs validate the checked-out workspace version.
              workspace = tomllib.loads(pathlib.Path('Cargo.toml').read_text())
              tag = 'v' + workspace['workspace']['package']['version']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'tag={tag}', file=output)
          PYTHON

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
      - name: Install AVIF native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdav1d-dev pkg-config
          pkg-config --atleast-version=1.3.0 dav1d
      - run: python3 scripts/check-packages.py
      - run: cargo package --workspace --all-features --locked

  build:
    name: build (${{ matrix.target }})
    needs: meta
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        # Install the stable Rust channel.
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build and check identity
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          features="$(python3 scripts/bundles.py features default)"
          cargo build --release --locked -p saccade --features "$features" --target "$TARGET"
          binary="$CARGO_TARGET_DIR/$TARGET/release/saccade"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          "$binary" doctor --json > doctor.json
          python3 - <<'PY'
          import json, os
          d = json.load(open('doctor.json'))
          tag = os.environ['RELEASE_TAG']
          assert tag.startswith('v') and d['version'] == tag[1:], (tag, d['version'])
          assert d['build']['git_commit'] == os.environ['RELEASE_COMMIT'], d['build']
          assert d['build']['git_dirty'] is False, d['build']
          PY
      - name: Generate dependency notices and archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p dist/package
          python3 scripts/generate-third-party-notices.py dist/package/THIRD_PARTY_NOTICES.md
          cp LICENSE-MIT LICENSE-APACHE dist/package/
          binary="$CARGO_TARGET_DIR/$TARGET/release/saccade"
          if [ "$EXT" = zip ]; then
            cp "$binary.exe" dist/package/
            (cd dist/package && 7z a -tzip "../saccade-$TARGET.zip" saccade.exe LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md)
          else
            cp "$binary" dist/package/
            tar -czf "dist/saccade-$TARGET.tar.gz" -C dist/package saccade LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md
          fi
          python3 scripts/check-release-notices.py "dist/saccade-$TARGET.$EXT"
      - name: Default bundle inventory and smoke test
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
        run: |
          set -euo pipefail
          binary="$CARGO_TARGET_DIR/$TARGET/release/saccade"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          stem="$(python3 scripts/bundles.py stem default "$TARGET")"
          mkdir -p bundle-out
          cp "dist/saccade-$TARGET.$EXT" "bundle-out/$stem.$EXT"
          python3 scripts/bundles.py smoke default "$binary" "$TARGET" "bundle-out/$stem.smoke.json" "$RELEASE_TAG"
          python3 scripts/bundles.py inventory default "$binary" "$TARGET" "bundle-out/$stem.$EXT" doctor.json "bundle-out/$stem.inventory.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-default-${{ matrix.target }}
          path: bundle-out/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saccade-${{ matrix.target }}
          path: dist/saccade-${{ matrix.target }}.${{ matrix.ext }}
          if-no-files-found: error

  assemble:
    needs: [build, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: saccade-*
          path: dist
          merge-multiple: true
      - name: Check archive set and write SHA256SUMS
        shell: bash
        env:
          RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          cd dist
          for name in saccade-x86_64-unknown-linux-gnu.tar.gz saccade-aarch64-unknown-linux-gnu.tar.gz saccade-aarch64-apple-darwin.tar.gz saccade-x86_64-pc-windows-msvc.zip; do
            test -s "$name"
          done
          sha256sum saccade-*.tar.gz saccade-*.zip > SHA256SUMS
          sha256sum -c SHA256SUMS
          printf '%s\n' "$RELEASE_COMMIT" > BUILD_COMMIT
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  bundle:
    name: bundle ${{ matrix.bundle }} (${{ matrix.target }})
    needs: meta
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    strategy:
      fail-fast: true
      matrix:
        include:
          - {bundle: media, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz}
          - {bundle: media, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz}
          - {bundle: media, os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz}
          - {bundle: media, os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip}
          - {bundle: full, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: tar.gz}
          - {bundle: full, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz}
          - {bundle: full, os: macos-latest, target: aarch64-apple-darwin, ext: tar.gz}
          - {bundle: full, os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build, check identity, archive, inventory and smoke test
        shell: bash
        env:
          BUNDLE: ${{ matrix.bundle }}
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          RELEASE_TAG: ${{ needs.meta.outputs.tag }}
          RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          features="$(python3 scripts/bundles.py features "$BUNDLE")"
          cargo build --release --locked -p saccade --features "$features" --target "$TARGET"
          binary="$CARGO_TARGET_DIR/$TARGET/release/saccade"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          "$binary" doctor --json > doctor.json
          python3 - <<'PY'
          import json, os
          d = json.load(open('doctor.json'))
          tag = os.environ['RELEASE_TAG']
          assert d['version'] == tag[1:], (tag, d['version'])
          assert d['build']['git_commit'] == os.environ['RELEASE_COMMIT'], d['build']
          assert d['build']['git_dirty'] is False, d['build']
          PY
          stem="$(python3 scripts/bundles.py stem "$BUNDLE" "$TARGET")"
          mkdir -p dist/package bundle-out
          python3 scripts/generate-third-party-notices.py dist/package/THIRD_PARTY_NOTICES.md
          cp LICENSE-MIT LICENSE-APACHE dist/package/
          if [ "$EXT" = zip ]; then
            cp "$binary" dist/package/saccade.exe
            (cd dist/package && 7z a -tzip "../../bundle-out/$stem.zip" saccade.exe LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md)
          else
            cp "$binary" dist/package/saccade
            tar -czf "bundle-out/$stem.tar.gz" -C dist/package saccade LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md
          fi
          python3 scripts/check-release-notices.py "bundle-out/$stem.$EXT"
          python3 scripts/bundles.py smoke "$BUNDLE" "$binary" "$TARGET" "bundle-out/$stem.smoke.json" "$RELEASE_TAG"
          python3 scripts/bundles.py inventory "$BUNDLE" "$binary" "$TARGET" "bundle-out/$stem.$EXT" doctor.json "bundle-out/$stem.inventory.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-${{ matrix.bundle }}-${{ matrix.target }}
          path: bundle-out/
          if-no-files-found: error

  bundle-assemble:
    needs: [build, bundle]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bundle-*
          path: bundle-dist
          merge-multiple: true
      - name: Check the bundle asset set, smoke results and write checksums
        shell: bash
        run: |
          set -euo pipefail
          cd bundle-dist
          python3 ../scripts/bundles.py expected | sort > ../expected.txt
          find . -maxdepth 1 -type f -printf '%f\n' | sort > ../actual.txt
          diff ../expected.txt ../actual.txt
          python3 - <<'PY'
          import glob, json
          for path in glob.glob('*.smoke.json'):
              result = json.load(open(path))
              assert result['status'] == 'passed', path
          PY
          sha256sum saccade-*.tar.gz saccade-*.zip saccade-*.inventory.json saccade-*.smoke.json > SHA256SUMS-bundles
          sha256sum -c SHA256SUMS-bundles
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bundle-dist
          path: bundle-dist/
          if-no-files-found: error

  qualify:
    needs: [meta, assemble]
    uses: ./.github/workflows/qualify.yml
    with:
      run_id: ${{ github.run_id }}
      commit: ${{ github.event.pull_request.head.sha || github.sha }}
      tag: ${{ needs.meta.outputs.tag }}

  release:
    needs: [assemble, qualify, bundle-assemble]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundle-dist
          path: dist-bundles
      - name: Verify and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          (cd dist-bundles && sha256sum -c SHA256SUMS-bundles)
          # The legacy asset names and SHA256SUMS are unchanged; bundle assets sit beside them.
          gh release create "$TAG" dist/saccade-*.tar.gz dist/saccade-*.zip dist/SHA256SUMS \
            dist-bundles/saccade-*.tar.gz dist-bundles/saccade-*.zip dist-bundles/saccade-*.inventory.json \
            dist-bundles/saccade-*.smoke.json dist-bundles/SHA256SUMS-bundles \
            --repo "$REPO" --title "$TAG" --generate-notes

  crates:
    name: Publish crates.io
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    concurrency:
      group: crates-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check tag and already published versions
        id: versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, tomllib, urllib.error, urllib.request
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          workspace = tomllib.loads(pathlib.Path('Cargo.toml').read_text())
          if workspace['workspace']['package']['version'] != version:
              raise SystemExit('::error::Tag and workspace versions differ')
          for crate, output in [('saccade-core', 'core'), ('saccade-print', 'print'),
                                ('saccade-geo', 'geo'), ('saccade', 'cli')]:
              manifest = tomllib.loads(pathlib.Path(f'crates/{crate}/Cargo.toml').read_text())
              package_version = manifest['package']['version']
              if package_version != version and package_version != {'workspace': True}:
                  raise SystemExit(f'::error::{crate} version differs from tag')
              request = urllib.request.Request(
                  f'https://crates.io/api/v1/crates/{crate}/{version}',
                  headers={'User-Agent': 'Tavrin/saccade release automation'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      published = json.load(response)['version']
                  if published['num'] != version or published['yanked']:
                      raise SystemExit(f'::error::{crate} registry version is mismatched or yanked')
                  print(f'::notice::{crate} {version} is already on crates.io; skipping publish')
                  needed = 'false'
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  needed = 'true'
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output_file:
                  print(f'{output}={needed}', file=output_file)
          PYTHON
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        if: >-
          steps.versions.outputs.core == 'true' || steps.versions.outputs.print == 'true' ||
          steps.versions.outputs.geo == 'true' || steps.versions.outputs.cli == 'true'
        with:
          toolchain: stable
      - name: Authenticate for saccade-core
        if: steps.versions.outputs.core == 'true'
        id: core-auth
        uses: rust-lang/crates-io-auth-action@v1.0.5
      - name: Publish saccade-core
        if: steps.versions.outputs.core == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.core-auth.outputs.token }}
        run: cargo publish --locked --registry crates-io -p saccade-core
      - name: Authenticate for saccade-print
        if: steps.versions.outputs.print == 'true'
        id: print-auth
        uses: rust-lang/crates-io-auth-action@v1.0.5
      - name: Publish saccade-print
        if: steps.versions.outputs.print == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.print-auth.outputs.token }}
        run: cargo publish --locked --registry crates-io -p saccade-print
      - name: Authenticate for saccade-geo
        if: steps.versions.outputs.geo == 'true'
        id: geo-auth
        uses: rust-lang/crates-io-auth-action@v1.0.5
      - name: Publish saccade-geo
        if: steps.versions.outputs.geo == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.geo-auth.outputs.token }}
        run: cargo publish --locked --registry crates-io -p saccade-geo
      - name: Authenticate for saccade
        if: steps.versions.outputs.cli == 'true'
        id: cli-auth
        uses: rust-lang/crates-io-auth-action@v1.0.5
      - name: Publish saccade
        if: steps.versions.outputs.cli == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cli-auth.outputs.token }}
        run: cargo publish --locked --registry crates-io -p saccade

  mcp:
    name: Publish MCP registry
    needs: crates
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check MCP version against tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          with open('server.json') as source:
              server = json.load(source)
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          if server['version'] != version:
              raise SystemExit('::error::server.json version differs from tag; refusing MCP publication')
          packages = [p for p in server['packages'] if p['registryType'] == 'cargo']
          if not packages or any(p['identifier'] != 'saccade' or p['version'] != version for p in packages):
              raise SystemExit('::error::server.json cargo package differs from tagged saccade version')
          PYTHON
      - name: Install checksum-verified MCP publisher v1.8.1
        env:
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mcp-publisher"
          cd "$RUNNER_TEMP/mcp-publisher"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz \
            --output publisher.tar.gz
          printf '%s  publisher.tar.gz\n' "$PUBLISHER_SHA256" | sha256sum --check --strict
          tar -xzf publisher.tar.gz mcp-publisher
          echo "$RUNNER_TEMP/mcp-publisher" >> "$GITHUB_PATH"
      - name: Authenticate and publish MCP manifest
        run: |
          set -euo pipefail
          mcp-publisher login github-oidc
          mcp-publisher publish server.json
