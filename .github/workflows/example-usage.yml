name: Example usage
# (dispatch-only; run from the Actions tab)

# Runs the action from this checkout on the generated examples/ set.
# examples/ contains a deliberate regression, so the final step is expected to fail.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch private flip-rs dependency
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.FLIP_RS_DEPLOY_KEY }}
      - name: Use SSH for flip-rs
        run: git config --global url."ssh://git@github.com/Tavrin/flip-rs".insteadOf "https://github.com/Tavrin/flip-rs"
      - uses: dtolnay/rust-toolchain@stable
      - uses: ./
        with:
          baseline-dir: examples/baseline
          capture-dir: examples/capture
          report-dir: saccade-report
          comment: 'false'
