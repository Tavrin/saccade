name: Showcase Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/showcase/**'
      - 'showcases/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch private flip-rs dependency
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.FLIP_RS_DEPLOY_KEY }}
      - name: Use SSH for flip-rs
        run: git config --global url."ssh://git@github.com/Tavrin/flip-rs".insteadOf "https://github.com/Tavrin/flip-rs"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 -m pip install Pillow
      - run: cargo build --release --locked -p saccade
      - name: Build gallery and reports
        run: python3 docs/showcase/build.py --saccade target/release/saccade --out "$RUNNER_TEMP/saccade-pages/showcase"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/saccade-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
