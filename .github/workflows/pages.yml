name: Showcase Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/showcase/**'
      - 'showcases/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        # Install the stable Rust channel.
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - run: python3 -m pip install Pillow
      - run: cargo build --release --locked -p saccade --features prechecks
      - name: Build gallery and reports
        run: python3 docs/showcase/build.py --saccade "$CARGO_TARGET_DIR/release/saccade" --out "$RUNNER_TEMP/saccade-pages/showcase"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ${{ runner.temp }}/saccade-pages
      - name: Check Pages availability
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$(gh api "repos/$REPO/pages" --jq '.build_type' 2>/dev/null)" = workflow ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deployment: Pages must be available and enabled with GitHub Actions as its source."
          fi

  deploy:
    needs: build
    if: ${{ needs.build.outputs.pages-enabled == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
