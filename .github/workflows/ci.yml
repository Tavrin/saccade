name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE-*", ".github/workflows/example-usage.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE-*", ".github/workflows/example-usage.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_RUSTC_WRAPPER: ''
  RUSTC_WRAPPER: ''

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        # Install the stable Rust channel.
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  clippy-test:
    name: clippy and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        # Install the stable Rust channel.
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast

  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: saccade-core
            flags: --no-default-features
          - package: saccade
            flags: ''
          - package: saccade
            flags: --all-features
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
      - run: cargo build --locked -p ${{ matrix.package }} ${{ matrix.flags }}
      - run: cargo test --locked -p ${{ matrix.package }} ${{ matrix.flags }}

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: '1.89'
      - run: cargo check --locked -p saccade
      - run: cargo test --locked -p saccade --test quality_reference

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
      - run: python3 scripts/check-packages.py
      - run: cargo package --workspace --all-features --locked

  release-check:
    runs-on: ubuntu-latest
    env:
      # This job compiles several feature sets; debug symbols exhaust runner disk.
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # stable
        with:
          toolchain: stable
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow==10.2.0 numpy==2.2.6 jsonschema==4.10.3
      - name: Install actionlint v1.7.7
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: scripts/release-check.sh
