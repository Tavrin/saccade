name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE-*", ".github/workflows/example-usage.yml", ".github/workflows/release.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE-*", ".github/workflows/example-usage.yml", ".github/workflows/release.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch private flip-rs dependency
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.FLIP_RS_DEPLOY_KEY }}
      - name: Use SSH for flip-rs
        run: git config --global url."ssh://git@github.com/Tavrin/flip-rs".insteadOf "https://github.com/Tavrin/flip-rs"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy-test:
    name: clippy and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch private flip-rs dependency
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.FLIP_RS_DEPLOY_KEY }}
      - name: Use SSH for flip-rs
        run: git config --global url."ssh://git@github.com/Tavrin/flip-rs".insteadOf "https://github.com/Tavrin/flip-rs"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
