name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE-*", ".github/workflows/example-usage.yml", ".github/workflows/release.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE-*", ".github/workflows/example-usage.yml", ".github/workflows/release.yml"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy-test:
    name: clippy and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # nv-flip-sys compiles C++ through the cc crate. GitHub-hosted runners
      # ship g++ (Linux), clang (macOS) and MSVC (Windows); ubuntu needs no extra package.
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
