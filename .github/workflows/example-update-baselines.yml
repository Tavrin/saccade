name: Example baseline-update pull request

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Replace examples/capture with your generated captures in a real workflow.
      - uses: ./
        with:
          baseline-dir: examples/baseline
          capture-dir: examples/capture
          report-dir: saccade-update-report
          artifact-name: saccade-update-report
          comment: 'false'
          update-baselines: 'true'
          update-branch-prefix: saccade/update-baselines
          update-prune-missing: 'false'
